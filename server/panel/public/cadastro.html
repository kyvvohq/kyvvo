<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3Evv%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card card-cadastro">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <h1 class="cadastro-titulo">Crie sua conta grátis</h1>
    <p class="cadastro-sub">Comece agora seu trial de 14 dias. Sem cartão de crédito.</p>

    <div class="cadastro-plano" id="cadastro-plano" hidden>
      <div class="cadastro-plano-info">
        <span class="cadastro-plano-label">Plano selecionado</span>
        <strong class="cadastro-plano-nome" id="cadastro-plano-nome"></strong>
        <span class="cadastro-plano-preco" id="cadastro-plano-preco"></span>
      </div>
      <label class="cadastro-plano-trocar-label" for="cadastro-plano-select">Trocar plano</label>
      <select id="cadastro-plano-select"></select>
    </div>

    <form id="form-cadastro" novalidate>
      <label for="nome_responsavel">Nome Responsável</label>
      <input type="text" id="nome_responsavel" autocomplete="name" placeholder="Nome completo do responsável">
      <div class="field-error" id="erro-nome_responsavel"></div>

      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
      <div class="field-error" id="erro-email"></div>

      <label for="segmento">Segmento</label>
      <select id="segmento" autocomplete="off">
        <option value="" disabled selected>Selecione seu segmento...</option>
      </select>
      <div class="field-error" id="erro-segmento"></div>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" autocomplete="tel" placeholder="(34) 99999-9999">
      <div class="field-error" id="erro-telefone"></div>

      <label for="whatsapp">WhatsApp</label>
      <input type="tel" id="whatsapp" autocomplete="tel" placeholder="(34) 99999-9999">
      <div class="field-error" id="erro-whatsapp"></div>

      <label for="senha">Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" autocomplete="new-password">
        <button type="button" id="btn-toggle-senha" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">👁</button>
      </div>
      <div class="field-error" id="erro-senha"></div>

      <button type="submit" id="btn-criar">Começar grátis</button>
      <div class="erro" id="erro-geral" role="alert"></div>
    </form>

    <p class="cadastro-legal">Ao criar sua conta, você concorda com os <a href="https://kyvvo.com.br/termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="https://kyvvo.com.br/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a> do Kyvvo.</p>
    <p class="cadastro-rodape">Já tem conta? <a href="/login.html">Entrar</a></p>
  </div>
</div>
<footer class="rodape-app">
  <div class="logo">ky<span class="logo-vv">vv</span>o</div>
  <p class="rodape-app-copy">© 2026 Kyvvo. Todos os direitos reservados.</p>
</footer>
<script>
  // Se já está logado, não faz sentido cadastrar de novo.
  if (localStorage.getItem('kyvvo_token')) {
    window.location.href = '/painel.html';
  }

  const form = document.getElementById('form-cadastro');
  const btn = document.getElementById('btn-criar');
  const erroGeral = document.getElementById('erro-geral');
  const senhaInput = document.getElementById('senha');
  const toggleSenhaBtn = document.getElementById('btn-toggle-senha');

  const campos = {
    nome_responsavel: document.getElementById('nome_responsavel'),
    email: document.getElementById('email'),
    segmento: document.getElementById('segmento'),
    telefone: document.getElementById('telefone'),
    whatsapp: document.getElementById('whatsapp'),
    senha: senhaInput,
  };

  // Mesmas regras validadas no backend (index.js) — mantidas em sincronia.
  const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const SENHA_REGEX = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

  function validarTelefone(valor) {
    let d = (valor || '').replace(/\D/g, '');
    if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
    if (d.length < 10 || d.length > 11) return false;
    const ddd = parseInt(d.slice(0, 2), 10);
    return ddd >= 11 && ddd <= 99;
  }

  // Máscara de telefone brasileiro (fixo ou celular) ao vivo — mesma lógica
  // usada em "Meu Perfil" (app.js `formatarTelefoneMascara`); duplicada aqui
  // porque cadastro.html não carrega app.js (tela pública, sem sessão).
  function formatarTelefoneMascara(valor) {
    const digitos = (valor || '').replace(/\D/g, '').slice(0, 11);
    if (digitos.length <= 2) return digitos ? `(${digitos}` : '';
    const ddd = digitos.slice(0, 2);
    const resto = digitos.slice(2);
    if (digitos.length <= 10) {
      return resto.length > 4 ? `(${ddd}) ${resto.slice(0, 4)}-${resto.slice(4)}` : `(${ddd}) ${resto}`;
    }
    return `(${ddd}) ${resto.slice(0, 5)}-${resto.slice(5)}`;
  }

  campos.telefone.addEventListener('input', () => {
    campos.telefone.value = formatarTelefoneMascara(campos.telefone.value);
  });

  // CA02 — dropdown de segmento populado dinamicamente (tabela `segmentos`).
  fetch('/api/segmentos')
    .then((res) => {
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    })
    .then((data) => {
      const lista = (data && data.segmentos) || [];
      campos.segmento.innerHTML =
        '<option value="" disabled selected>Selecione seu segmento...</option>' +
        lista.map((s) => `<option value="${s.id}">${s.nome}</option>`).join('');
    })
    .catch(() => {
      mostrarErroCampo('segmento', 'Não foi possível carregar os segmentos. Tente novamente.');
    });

  // US67/CA06 — plano vindo da landing via ?plano=<slug> (CTA de cada card):
  // mostra nome/preço pré-selecionados e deixa trocar de plano sem voltar
  // pra landing. Guardado em sessionStorage pra sobreviver até a tela de
  // pagamento (US32) sem precisar propagar o parâmetro por link em link.
  const planoBox = document.getElementById('cadastro-plano');
  const planoNomeEl = document.getElementById('cadastro-plano-nome');
  const planoPrecoEl = document.getElementById('cadastro-plano-preco');
  const planoSelect = document.getElementById('cadastro-plano-select');

  function formatarPrecoPlano(valor) {
    return `R$ ${Number(valor).toFixed(2).replace('.', ',')}/mês`;
  }

  function exibirPlanoSelecionado(planos, slug) {
    const plano = planos.find((p) => p.slug === slug) || planos[0];
    if (!plano) return;
    planoNomeEl.textContent = plano.nome;
    planoPrecoEl.textContent = formatarPrecoPlano(plano.preco_mensal);
    planoSelect.value = plano.slug;
    planoBox.hidden = false;
    sessionStorage.setItem('kyvvo_plano_selecionado', plano.slug);
  }

  const slugDaUrl = new URLSearchParams(window.location.search).get('plano');
  if (slugDaUrl) {
    Promise.all([
      fetch('/api/planos').then((res) => {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      }),
      // US72/CA02 — resolve slug legado (ex: "starter") pro slug atual
      // (ex: "essencial"): a lista de /api/planos só tem slugs ativos
      // atuais, então um slug antigo nunca dá match nela direto. 404 (slug
      // desconhecido) vira null e cai no fallback já existente abaixo.
      fetch(`/api/planos/${encodeURIComponent(slugDaUrl)}`).then((res) => (res.ok ? res.json() : null)),
    ])
      .then(([planos, planoResolvido]) => {
        if (!planos.length) return;
        planoSelect.innerHTML = planos
          .map((p) => `<option value="${p.slug}">${p.nome} — ${formatarPrecoPlano(p.preco_mensal)}</option>`)
          .join('');
        const slugAlvo = planoResolvido ? planoResolvido.slug : slugDaUrl;
        // CA02 — normaliza a URL pro slug novo quando o link usava o antigo,
        // sem recarregar a página nem empilhar entrada no histórico.
        if (planoResolvido && planoResolvido.slug !== slugDaUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set('plano', planoResolvido.slug);
          window.history.replaceState(null, '', url);
        }
        exibirPlanoSelecionado(planos, slugAlvo);
        planoSelect.addEventListener('change', () => exibirPlanoSelecionado(planos, planoSelect.value));
      })
      .catch(() => {
        // Sem o catálogo não dá pra mostrar nome/preço com segurança (CA06)
        // — segue o cadastro normalmente, só sem a prévia do plano.
      });
  }

  const validadores = {
    nome_responsavel: (v) => (v.trim().length >= 2 ? '' : 'Informe o nome do responsável.'),
    email: (v) => (EMAIL_REGEX.test(v.trim()) ? '' : 'Digite um e-mail válido.'),
    segmento: (v) => (v ? '' : 'Selecione seu segmento.'),
    telefone: (v) => (validarTelefone(v) ? '' : 'Digite um telefone válido com DDD.'),
    whatsapp: (v) => (validarTelefone(v) ? '' : 'Digite um número de WhatsApp válido com DDD.'),
    senha: (v) => (SENHA_REGEX.test(v) ? '' : 'A senha deve ter no mínimo 8 caracteres, 1 número e 1 letra maiúscula.'),
  };

  function mostrarErroCampo(nome, mensagem) {
    const input = campos[nome];
    const alvo = document.getElementById('erro-' + nome);
    alvo.textContent = mensagem;
    input.classList.toggle('invalid', !!mensagem);
    return !mensagem;
  }

  // CA02 — validação ao perder o foco (onBlur).
  Object.keys(campos).forEach((nome) => {
    campos[nome].addEventListener('blur', () => mostrarErroCampo(nome, validadores[nome](campos[nome].value)));
    campos[nome].addEventListener('input', () => {
      if (campos[nome].classList.contains('invalid')) {
        mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      }
    });
  });

  toggleSenhaBtn.addEventListener('click', () => {
    const oculta = senhaInput.type === 'password';
    senhaInput.type = oculta ? 'text' : 'password';
    toggleSenhaBtn.textContent = oculta ? '🙈' : '👁';
    toggleSenhaBtn.setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroGeral.textContent = '';

    let valido = true;
    let primeiroInvalido = null;
    Object.keys(campos).forEach((nome) => {
      const ok = mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      if (!ok && !primeiroInvalido) primeiroInvalido = campos[nome];
      valido = valido && ok;
    });
    if (!valido) {
      if (primeiroInvalido) primeiroInvalido.focus();
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = 'Criando conta...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome_responsavel: campos.nome_responsavel.value,
          email: campos.email.value,
          segmento_id: Number(campos.segmento.value),
          telefone: campos.telefone.value,
          whatsapp: campos.whatsapp.value,
          senha: campos.senha.value,
        }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        localStorage.setItem('kyvvo_token', data.token);
        localStorage.setItem('kyvvo_nome', data.nome || '');
        localStorage.setItem('kyvvo_email', data.email || '');
        localStorage.setItem('kyvvo_email_verified', 'false');
        // Liga a identidade anônima (que já vinha capturando o cta_clicado na
        // landing, via cross_subdomain_cookie) à conta recém-criada — sem
        // isso o funil visita→cadastro vira duas pessoas separadas no
        // PostHog (US47).
        if (window.kyvvoIdentify) window.kyvvoIdentify(data.email, { nome: data.nome });
        if (window.kyvvoCapture) window.kyvvoCapture('cadastro_concluido');
        window.location.href = '/verificar.html';
        return;
      }

      // Erro de unicidade (CA03) volta em português direto da API.
      erroGeral.textContent = data.error || 'Erro ao criar conta. Tente novamente.';
    } catch (err) {
      erroGeral.textContent = 'Erro ao processar. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = 'Começar grátis';
    }
  });
</script>
</body>
</html>

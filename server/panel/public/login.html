<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Kyvvo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="center-screen">
  <div class="card">
    <div class="logo">Kyvvo</div>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="erro"></div>
    </form>
  </div>
</div>
<script>
  const form = document.getElementById('form-login');
  const erroEl = document.getElementById('erro');
  const btn = document.getElementById('btn-entrar');

  if (localStorage.getItem('kyvvo_token')) {
    window.location.href = '/painel.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        erroEl.textContent = data.error || 'Erro ao entrar';
        return;
      }

      localStorage.setItem('kyvvo_token', data.token);
      localStorage.setItem('kyvvo_nome', data.nome || '');
      window.location.href = '/painel.html';
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>

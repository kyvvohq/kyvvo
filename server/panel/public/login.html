<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3Evv%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* Página carregada dentro do iframe do modal de login da landing
     (server/public/partials/header.html) — sem rodapé e sem scroll, pra
     caber inteira na altura fixa do modal (login-modal, shared.css). */
  html, body { height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div class="center-screen">
  <div class="card">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
      <label for="senha">Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" autocomplete="current-password">
        <button type="button" id="btn-toggle-senha" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">👁</button>
      </div>
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>
  </div>
</div>
<script>
  const form = document.getElementById('form-login');
  const erroEl = document.getElementById('erro');
  const btn = document.getElementById('btn-entrar');
  const emailInput = document.getElementById('email');
  const senhaInput = document.getElementById('senha');
  const toggleSenhaBtn = document.getElementById('btn-toggle-senha');
  const inIframe = window.self !== window.top;

  function irParaPainel() {
    if (inIframe) {
      // Carregado dentro do modal de login da landing: avisa o pai em vez de
      // navegar só dentro do iframe, para a aba inteira ir para o painel.
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success' }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/painel.html';
    }
  }

  function irParaAdminPainel() {
    if (inIframe) {
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success', admin: true }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/admin/painel.html';
    }
  }

  // Login sem e-mail validado (US20/CA10): manda pra tela de validação do
  // token em vez de entrar no portal.
  function irParaVerificar() {
    if (inIframe) {
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success', verificar: true }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/verificar.html';
    }
  }

  if (localStorage.getItem('kyvvo_token')) {
    // CA10: mesma checagem do handler de submit — não deixar cair direto no
    // painel se o cadastro ainda não foi validado.
    if (localStorage.getItem('kyvvo_email_verified') === 'false') {
      irParaVerificar();
    } else {
      irParaPainel();
    }
  } else if (localStorage.getItem('kyvvo_admin_token')) {
    irParaAdminPainel();
  }

  toggleSenhaBtn.addEventListener('click', () => {
    const oculta = senhaInput.type === 'password';
    senhaInput.type = oculta ? 'text' : 'password';
    toggleSenhaBtn.textContent = oculta ? '🙈' : '👁';
    toggleSenhaBtn.setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.textContent = '';

    if (!emailInput.value.trim() || !senhaInput.value) {
      erroEl.textContent = 'Preencha todos os campos.';
      (!emailInput.value.trim() ? emailInput : senhaInput).focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value,
          senha: senhaInput.value,
        }),
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('kyvvo_token', data.token);
        localStorage.setItem('kyvvo_nome', data.nome || '');
        if (data.email) localStorage.setItem('kyvvo_email', data.email);
        localStorage.setItem('kyvvo_email_verified', String(data.email_verified !== false));
        if (data.email_verified === false) {
          irParaVerificar();
        } else {
          irParaPainel();
        }
        return;
      }

      // Não bateu como tenant — antes de mostrar erro, tenta como admin da
      // Kyvvo, já que o mesmo formulário atende os dois públicos agora.
      const resAdmin = await fetch('/admin/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value,
          senha: senhaInput.value,
        }),
      });

      if (resAdmin.ok) {
        const dataAdmin = await resAdmin.json();
        localStorage.setItem('kyvvo_admin_token', dataAdmin.token);
        localStorage.setItem('kyvvo_admin_nome', dataAdmin.nome || '');
        irParaAdminPainel();
        return;
      }

      erroEl.textContent = 'E-mail ou senha incorretos. Tente novamente.';
      senhaInput.value = '';
      senhaInput.focus();
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>

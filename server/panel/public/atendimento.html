<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  // Mesmo guard de painel.html/bloqueio.html — só faz sentido atender quem
  // já tem sessão aberta.
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login';
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3Evv%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="atendimento-body">
<div class="atendimento-shell">
  <div class="atendimento-header">
    <div>
      <div class="atendimento-header-nome" id="atendimento-nome">Carregando…</div>
      <div class="atendimento-header-telefone" id="atendimento-telefone"></div>
    </div>
    <div class="atendimento-header-acoes">
      <button type="button" class="btn-secundario" id="btn-devolver-ia">Devolver pra IA</button>
      <button type="button" class="btn-secundario" id="btn-concluir">Concluir atendimento</button>
    </div>
  </div>
  <div class="atendimento-mensagens" id="atendimento-mensagens"></div>
  <form class="atendimento-form" id="atendimento-form">
    <input type="text" id="atendimento-input" placeholder="Digite sua mensagem, como se estivesse no WhatsApp..." autocomplete="off">
    <button type="submit" id="btn-enviar">Enviar</button>
  </form>
</div>

<script>
  const token = localStorage.getItem('kyvvo_token');
  const clienteId = new URLSearchParams(location.search).get('clienteId');
  if (!clienteId) {
    document.body.innerHTML = '<p style="padding:24px">Cliente não informado.</p>';
    throw new Error('clienteId ausente na URL');
  }

  async function api(path, options = {}) {
    // Content-Type só entra com body de verdade — Fastify rejeita (400
    // FST_ERR_CTP_EMPTY_JSON_BODY) POST sem corpo que declara json (caso de
    // /assumir e /liberar aqui, POST só pelo efeito colateral).
    const headers = { Authorization: `Bearer ${token}`, ...(options.headers || {}) };
    if (options.body !== undefined) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, { ...options, headers });
    if (res.status === 401) {
      localStorage.removeItem('kyvvo_token');
      window.location.href = '/login';
      return null;
    }
    return res.json();
  }

  // Duplicado de app.js de propósito — esta página é standalone (aberta via
  // window.open, sem o resto do painel) e app.js assume elementos que não
  // existem aqui (#conteudo, menu, etc.), mesmo raciocínio de bloqueio.html.
  function escapeHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[c]));
  }

  function formatarTelefoneWhatsapp(valor) {
    const digitos = (valor || '').replace(/\D/g, '');
    if (digitos.length !== 12 && digitos.length !== 13) return valor || '';
    const ddi = digitos.slice(0, 2);
    const ddd = digitos.slice(2, 4);
    const numero = digitos.slice(4);
    const numeroFormatado = `${numero.slice(0, -4)}-${numero.slice(-4)}`;
    const bandeira = ddi === '55' ? '🇧🇷 ' : '';
    return `${bandeira}+${ddi} (${ddd}) ${numeroFormatado}`;
  }

  function formatarDataHoraCurta(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const data = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return `${data} às ${hora}`;
  }

  function mostrarToast(mensagem, tipo = 'sucesso') {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;
    toast.textContent = (tipo === 'sucesso' ? '✅ ' : '❌ ') + mensagem;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('toast-saindo');
      setTimeout(() => toast.remove(), 250);
    }, 4000);
  }

  const elMensagens = document.getElementById('atendimento-mensagens');
  const elNome = document.getElementById('atendimento-nome');
  const elTelefone = document.getElementById('atendimento-telefone');
  const form = document.getElementById('atendimento-form');
  const input = document.getElementById('atendimento-input');
  const btnEnviar = document.getElementById('btn-enviar');

  let ultimaAssinatura = '';
  let encerrado = false;

  // Só redesenha o DOM quando o conteúdo realmente muda (contagem + hora da
  // última mensagem) — evita "piscar"/perder a posição de rolagem a cada
  // poll de 4s quando não chegou nada novo.
  async function carregarConversa({ forcarScroll = false } = {}) {
    const dados = await api(`/api/whatsapp/conversas/${clienteId}`);
    if (!dados) return;

    elNome.textContent = dados.cliente.nome || 'Cliente';
    elTelefone.textContent = formatarTelefoneWhatsapp(dados.cliente.telefone || '');

    const assinatura = `${dados.mensagens.length}:${dados.mensagens[dados.mensagens.length - 1]?.criado_em || ''}`;
    if (assinatura === ultimaAssinatura && !forcarScroll) return;
    ultimaAssinatura = assinatura;

    const pertoDoFim = elMensagens.scrollHeight - elMensagens.scrollTop - elMensagens.clientHeight < 80;

    elMensagens.innerHTML = dados.mensagens.length
      ? dados.mensagens.map((m) => `
          <div class="chat-bolha ${m.role === 'user' ? 'chat-bolha-cliente' : 'chat-bolha-atendente'}">
            <div class="chat-bolha-texto">${escapeHtml(m.texto || '')}</div>
            <div class="chat-bolha-hora">${formatarDataHoraCurta(m.criado_em)}</div>
          </div>
        `).join('')
      : '<div class="vazio">Nenhuma mensagem registrada.</div>';

    if (forcarScroll || pertoDoFim) {
      elMensagens.scrollTop = elMensagens.scrollHeight;
    }
  }

  function travarEncerrado() {
    encerrado = true;
    input.disabled = true;
    btnEnviar.disabled = true;
    document.getElementById('btn-devolver-ia').disabled = true;
    document.getElementById('btn-concluir').disabled = true;
    const aviso = document.createElement('div');
    aviso.className = 'atendimento-encerrado';
    aviso.textContent = 'Atendimento encerrado nesta janela — pode fechar.';
    document.querySelector('.atendimento-shell').appendChild(aviso);
  }

  async function liberar() {
    if (encerrado) return;
    const dados = await api(`/api/whatsapp/conversas/${clienteId}/liberar`, { method: 'POST' });
    if (!dados || !dados.ok) {
      mostrarToast('Não foi possível concluir. Tente de novo.', 'erro');
      return;
    }
    mostrarToast('Atendimento liberado.');
    travarEncerrado();
    setTimeout(() => { try { window.close(); } catch (e) { /* alguns navegadores bloqueiam fechar por script */ } }, 1200);
  }

  document.getElementById('btn-devolver-ia').addEventListener('click', liberar);
  document.getElementById('btn-concluir').addEventListener('click', liberar);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = input.value.trim();
    if (!texto || encerrado) return;
    input.disabled = true;
    btnEnviar.disabled = true;
    const dados = await api(`/api/whatsapp/conversas/${clienteId}/mensagem`, {
      method: 'POST',
      body: JSON.stringify({ texto }),
    });
    input.disabled = false;
    btnEnviar.disabled = false;
    if (!dados || !dados.ok) {
      mostrarToast((dados && dados.error) || 'Falha ao enviar a mensagem.', 'erro');
      input.focus();
      return;
    }
    input.value = '';
    input.focus();
    await carregarConversa({ forcarScroll: true });
  });

  // Marca a conversa como assumida assim que a janela abre — o botão
  // "Assumir atendimento" (app.js) já chama /assumir antes de abrir esta
  // aba, mas chama de novo aqui também (idempotente) pra cobrir o caso de
  // alguém reabrir esta URL diretamente (ex.: histórico do navegador).
  (async function iniciar() {
    await api(`/api/whatsapp/conversas/${clienteId}/assumir`, { method: 'POST' });
    await carregarConversa({ forcarScroll: true });
    input.focus();
  })();

  const intervaloPoll = setInterval(carregarConversa, 4000);
  window.addEventListener('beforeunload', () => clearInterval(intervaloPoll));
</script>
</body>
</html>

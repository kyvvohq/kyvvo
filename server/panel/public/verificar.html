<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  // Só faz sentido validar quem já tem sessão (cadastro ou login sem validação).
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login.html';
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme seu e-mail — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3Evv%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <h1 class="cadastro-titulo">Confirme seu e-mail</h1>
    <p class="cadastro-sub" id="instrucao">Enviamos um código de 6 dígitos para seu e-mail e para seu WhatsApp.</p>

    <form id="form-token" novalidate>
      <label for="token">Código de verificação</label>
      <input type="text" id="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="otp-input" placeholder="000000">
      <button type="submit" id="btn-validar">Validar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>

    <p class="cadastro-rodape">
      Não recebeu?
      <a href="#" id="link-reenviar" class="link-desabilitado">Reenviar código</a>
      <span id="contador-reenvio" class="contador-reenvio"></span>
    </p>
  </div>
</div>
<footer class="rodape-app">
  <div class="logo">ky<span class="logo-vv">vv</span>o</div>
  <p class="rodape-app-copy">© 2026 Kyvvo. Todos os direitos reservados.</p>
</footer>
<script>
  const token = localStorage.getItem('kyvvo_token');
  const form = document.getElementById('form-token');
  const tokenInput = document.getElementById('token');
  const btn = document.getElementById('btn-validar');
  const erroEl = document.getElementById('erro');
  const instrucao = document.getElementById('instrucao');
  const linkReenviar = document.getElementById('link-reenviar');
  const contador = document.getElementById('contador-reenvio');

  // Só dígitos no campo do token.
  tokenInput.addEventListener('input', () => {
    tokenInput.value = tokenInput.value.replace(/\D/g, '').slice(0, 6);
    erroEl.textContent = '';
  });

  function mascararEmail(email) {
    const [u, d] = (email || '').split('@');
    if (!d) return email || 'seu e-mail';
    return u.slice(0, 2) + '*'.repeat(Math.max(u.length - 2, 1)) + '@' + d;
  }

  // Preenche o e-mail mascarado (CA07). Usa o que veio no cadastro/login; se
  // não tiver, busca do backend.
  async function preencherInstrucao() {
    let email = localStorage.getItem('kyvvo_email');
    let verificado = false;
    try {
      const res = await fetch('/api/tenant/status', { headers: { Authorization: `Bearer ${token}` } });
      if (res.ok) {
        const data = await res.json();
        if (data.email) email = data.email;
        verificado = data.email_verified;
      }
    } catch (e) {}
    // Já verificado: não precisa ficar nesta tela.
    if (verificado) {
      window.location.href = '/painel.html';
      return;
    }
    instrucao.textContent = `Enviamos um código de 6 dígitos para ${mascararEmail(email)} e para seu WhatsApp.`;
  }
  preencherInstrucao();

  // CA07 — "Reenviar código" disponível só depois de 60 segundos.
  let cooldown = 0;
  let cooldownInterval = null;
  function iniciarCooldown(segundos) {
    cooldown = segundos;
    linkReenviar.classList.add('link-desabilitado');
    if (cooldownInterval) clearInterval(cooldownInterval);
    const tick = () => {
      if (cooldown <= 0) {
        clearInterval(cooldownInterval);
        cooldownInterval = null;
        contador.textContent = '';
        linkReenviar.classList.remove('link-desabilitado');
        return;
      }
      contador.textContent = `(${cooldown}s)`;
      cooldown -= 1;
    };
    tick();
    cooldownInterval = setInterval(tick, 1000);
  }
  iniciarCooldown(60);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.textContent = '';

    if (!/^\d{6}$/.test(tokenInput.value)) {
      erroEl.textContent = 'Digite o código de 6 dígitos.';
      tokenInput.focus();
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = 'Validando...';

    try {
      const res = await fetch('/api/auth/verify-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ token: tokenInput.value }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        // CA08 — toast é exibido pelo painel após o redirect.
        localStorage.setItem('kyvvo_email_verified', 'true');
        // Aha Moment do MVP (US47): e-mail validado = trial de 14 dias ativo
        // e usuário liberado pro painel de verdade.
        if (window.kyvvoCapture) window.kyvvoCapture('conta_ativada');
        window.location.href = '/painel.html?verificado=1';
        return;
      }
      erroEl.textContent = data.error || 'Código incorreto. Tente novamente.';
      tokenInput.focus();
    } catch (err) {
      erroEl.textContent = 'Erro ao processar. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = 'Validar';
    }
  });

  linkReenviar.addEventListener('click', async (e) => {
    e.preventDefault();
    if (cooldown > 0 || linkReenviar.classList.contains('link-desabilitado')) return;

    linkReenviar.classList.add('link-desabilitado');
    erroEl.textContent = '';
    try {
      const res = await fetch('/api/auth/resend-token', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        contador.textContent = ' — novo código enviado!';
        setTimeout(() => { contador.textContent = ''; }, 2500);
        iniciarCooldown(60);
      } else {
        erroEl.textContent = data.error || 'Não foi possível reenviar. Tente novamente.';
        linkReenviar.classList.remove('link-desabilitado');
      }
    } catch (err) {
      erroEl.textContent = 'Erro ao processar. Tente novamente.';
      linkReenviar.classList.remove('link-desabilitado');
    }
  });
</script>
</body>
</html>

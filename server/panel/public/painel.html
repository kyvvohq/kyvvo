<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login.html';
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3Evv%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div id="trial-banner" class="trial-banner" hidden></div>
<div class="painel-shell">
  <aside class="painel-sidebar">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <nav class="menu">
      <div class="menu-item" data-menu="inicio">Início</div>
      <div class="menu-item active" data-menu="agendamento">Agenda</div>
      <div class="menu-item-grupo" id="menu-cadastros-toggle">
        <span>Cadastros</span>
        <span class="menu-chevron">▾</span>
      </div>
      <div class="menu-submenu" id="menu-cadastros-submenu">
        <div class="menu-item" data-menu="servicos">Serviços</div>
        <div class="menu-item" data-menu="profissionais">Profissionais</div>
      </div>
    </nav>
  </aside>
  <div class="painel-main">
    <div class="topbar">
      <div class="topbar-textos">
        <div class="saudacao" id="saudacao"></div>
      </div>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-toggle" id="user-menu-toggle">
          <div class="user-menu-avatar" id="user-menu-avatar"></div>
          <div class="user-menu-textos">
            <div class="user-menu-nome" id="user-menu-nome"></div>
            <div class="user-menu-empresa" id="user-menu-empresa"></div>
          </div>
          <span class="user-menu-chevron">▾</span>
        </button>
        <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
          <div class="user-menu-item" data-menu="perfil">Meu Perfil</div>
          <div class="user-menu-item" data-menu="empresa">Minha Empresa</div>
          <div class="user-menu-item" data-menu="whatsapp">WhatsApp</div>
          <div class="user-menu-item" data-menu="pagamentos">Cobrança</div>
          <div class="user-menu-item" data-menu="configuracao">Preferências</div>
          <div class="user-menu-item" data-menu="ajuda">Ajuda</div>
          <div class="user-menu-divisor"></div>
          <button class="user-menu-sair" id="btn-sair"><span aria-hidden="true">⎋</span> Sair</button>
        </div>
      </div>
    </div>
    <div class="subtabs" id="subtabs">
      <div class="tab active" data-tab="dia">Dia</div>
      <div class="tab" data-tab="semana">Semana</div>
      <div class="tab" data-tab="mes">Mês</div>
      <button class="btn-novo-agendamento" id="btn-novo-agendamento">+ Novo agendamento</button>
    </div>
    <div class="conteudo" id="conteudo"></div>

    <footer class="rodape-app">
      <div class="logo">ky<span class="logo-vv">vv</span>o</div>
      <p class="rodape-app-copy">© 2026 Kyvvo. Todos os direitos reservados.</p>
    </footer>
  </div>
</div>

<script src="/pagamento-form.js"></script>
<script src="/app.js"></script>
</body>
</html>

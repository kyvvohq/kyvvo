<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login';
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div id="trial-banner" class="trial-banner" hidden></div>
<div id="avisos-painel"></div>
<div class="topbar">
  <div class="topbar-esquerda">
    <button class="logo topbar-logo" id="topbar-logo" aria-label="Ir para o início">ky<span class="logo-vv">vv</span>o</button>
    <div class="topbar-textos">
      <div class="saudacao" id="saudacao"></div>
    </div>
  </div>
  <div class="user-menu" id="user-menu">
    <button class="user-menu-toggle" id="user-menu-toggle">
      <div class="user-menu-avatar" id="user-menu-avatar"></div>
      <div class="user-menu-textos">
        <div class="user-menu-nome" id="user-menu-nome"></div>
        <div class="user-menu-empresa" id="user-menu-empresa"></div>
      </div>
      <span class="user-menu-chevron">▾</span>
    </button>
    <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
      <div class="user-menu-item" data-menu="perfil">Meu Perfil</div>
      <div class="user-menu-item" data-menu="equipe" data-somente-admin data-somente-plano-custom>Equipe</div>
      <div class="user-menu-item" data-menu="ajuda">Ajuda</div>
      <div class="user-menu-divisor"></div>
      <button class="user-menu-sair" id="btn-sair"><span aria-hidden="true">⎋</span> Sair</button>
    </div>
  </div>
</div>
<div id="cobranca-banner" class="cobranca-banner" hidden>
  <span class="cobranca-banner-texto" id="cobranca-banner-texto"></span>
  <button type="button" class="cobranca-banner-fechar" id="cobranca-banner-fechar" aria-label="Fechar aviso">×</button>
</div>
<div class="painel-shell">
  <aside class="painel-sidebar" id="painel-sidebar">
    <nav class="menu">
      <div class="menu-item active" data-menu="inicio">Início</div>
      <div class="menu-item" data-menu="agendamento">Agenda</div>
      <div class="menu-item" data-menu="servicos">Serviços</div>
      <div class="menu-item" data-menu="profissionais" data-somente-plano-custom>Profissionais</div>
      <div class="menu-item" data-menu="clientes">Clientes</div>
      <div id="menu-modulos-anchor"></div>
      <div class="menu-item-grupo" id="menu-config-toggle" data-submenu="menu-config-submenu">
        <span class="menu-chevron" aria-hidden="true"></span>
        <span>Configurações</span>
      </div>
      <div class="menu-submenu" id="menu-config-submenu">
        <div class="menu-item" data-menu="empresa" data-somente-admin>Meu negócio</div>
        <div class="menu-item" data-menu="configuracao" data-somente-admin>Preferências</div>
        <div class="menu-item" data-menu="bloqueios">Bloqueio de agenda</div>
        <div class="menu-item" data-menu="whatsapp">WhatsApp</div>
        <div class="menu-item" data-menu="pagamentos" data-somente-admin>Plano e cobrança</div>
      </div>
    </nav>
  </aside>
  <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>
  <div class="painel-main">
    <div class="subtabs" id="subtabs" style="display: none;">
      <div class="tab active" data-tab="dia">Dia</div>
      <div class="tab" data-tab="semana">Semana</div>
      <div class="tab" data-tab="mes">Mês</div>
      <button class="btn-novo-agendamento" id="btn-novo-agendamento">+ Novo agendamento</button>
    </div>
    <div class="conteudo" id="conteudo"></div>
  </div>
</div>
<footer class="rodape-app">
  <p class="rodape-app-copy">© 2026 <span class="logo rodape-logo-inline">ky<span class="logo-vv">vv</span>o</span>. Todos os direitos reservados.</p>
</footer>

<script src="/pagamento-form.js"></script>
<script src="/app.js"></script>
</body>
</html>
